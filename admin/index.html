<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQBot · 管理后台</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body>
<aside class="rail"><div class="brand"><span class="brand-icon">鲸</span><div>QQBot<small>管理后台</small></div></div><nav id="nav">
<button data-page="people" class="active">◎ <span>个人记忆管理</span></button><button data-page="groups">▧ <span>群记忆管理</span></button><button data-page="messages">≡ <span>聊天记录管理</span></button><button data-page="emotes">◉ <span>表情包管理</span></button><button data-page="prompts">✦ <span>提示词管理</span></button><button data-page="migration">⇄ <span>数据迁移</span></button><button data-page="changes">↶ <span>操作记录</span></button>
</nav><div class="rail-footer"><span class="dot"></span> 仅本机访问<small>模型建议经你确认后才保存</small></div></aside>
<main><header><button id="refresh" class="quiet">刷新数据 ↻</button></header>
<div id="status" role="status" aria-live="polite"></div><section id="content"></section></main>
<dialog id="confirm"><h2>确认这次修改</h2><p>只修改当前选中的资源。保存前会保留原值。</p><div class="diff"><div><h3>修改前</h3><pre id="before"></pre></div><div><h3>修改后</h3><pre id="after"></pre></div></div><div class="actions"><button id="cancel-confirm" class="quiet">返回编辑</button><button id="apply-confirm">确认并保存</button></div></dialog>
</body></html>
