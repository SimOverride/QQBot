[project]
name = "qqbot"
version = "0.1.0"
description = "Lightweight AI assistant for private QQ groups"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nonebot2[fastapi]>=2.4,<3",
    "nonebot-adapter-onebot>=2.4,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
